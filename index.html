<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 허영 의원 국정감사</title>
  <meta name="description" content="제22대 국회 국토교통위원회 국회의원 허영 2026년 국정감사" />
  <meta property="og:title" content="2026 허영 의원 국정감사" />
  <meta property="og:description" content="제22대 국회 국토교통위원회 국회의원 허영 2026년 국정감사" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 상단 헤더 -->
  <header class="site-header">
    <div class="header-main">
      <div class="container header-main-inner">
        <a href="#" class="brand-link" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">
          <div class="brand-mark" aria-hidden="true">허영</div>
          <div class="brand-text">
            <span class="brand-sub">더불어민주당 · 춘천·철원·화천·양구갑</span>
            <span class="brand-title">2026 허영 의원 국정감사</span>
          </div>
        </a>

        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="#highlightSection" class="nav-link">주요 질의</a>
          <a href="#scheduleSection" class="nav-link">일자별</a>
          <a href="#themeSection" class="nav-link">분야별</a>
          <a href="#archiveSection" class="nav-link">전체 질의</a>
          <button type="button" class="btn-reset-header" id="headerResetBtn">
            전체 보기
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- 히어로 섹션 -->
  <section class="hero-section">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-copy-col">
          <div class="hero-eyebrow">
            <span class="eyebrow-pill">제22대 국회 국토교통위원회 · 국회의원 허영</span>
          </div>

          <h1 class="hero-headline">
            2026 허영 의원<br />
            <em>국정감사 보고</em>
          </h1>

          <p class="hero-report-line">
            시민 여러분께 2026년도 국정감사 의정활동을 보고드립니다.
          </p>
        </div>

        <!-- 우측: 현장 사진 -->
        <div class="hero-media-col">
          <figure class="photo-card">
            <div class="photo-frame">
              <img src="profile.jpg" alt="국회의원 허영" loading="eager" />
            </div>
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- 주요 질의 -->
  <section id="highlightSection" class="highlight-section">
    <div class="container">
      <div class="highlight-header">
        <h2 class="section-title">주요 질의</h2>
        <div class="highlight-nav">
          <button type="button" id="hlPrevBtn" class="ctrl-btn" aria-label="이전">← 이전</button>
          <button type="button" id="hlNextBtn" class="ctrl-btn" aria-label="다음">다음 →</button>
        </div>
      </div>

      <div id="highlightTrack" class="highlight-track" role="region" aria-label="주요 질의 목록"></div>
    </div>
  </section>

  <!-- 일자별 일정 -->
  <section id="scheduleSection" class="schedule-section">
    <div class="container">
      <div class="schedule-panel">
        <div class="schedule-header">
          <h2 class="section-title">일자별 보기</h2>
          <div class="schedule-controls">
            <button type="button" id="btnAllStations" class="ctrl-btn active">
              전체 (51)
            </button>
            <button type="button" id="btnPrevStation" class="ctrl-btn" title="이전 일차">
              ← 이전
            </button>
            <button type="button" id="btnNextStation" class="ctrl-btn" title="다음 일차">
              다음 →
            </button>
          </div>
        </div>

        <div class="timeline-viewport">
          <div class="timeline-track">
            <div class="timeline-line-bg"></div>
            <div id="railLineProgress" class="timeline-line-fill"></div>
            <div id="stationNodesContainer" class="timeline-nodes" role="tablist" aria-label="국정감사 7개 일차"></div>
          </div>
        </div>

        <div id="stationSignboard" class="schedule-summary-bar"></div>
      </div>
    </div>
  </section>

  <!-- 메인 콘텐츠 -->
  <main class="container main-content">
    <!-- 분야별 보기 -->
    <section id="themeSection" class="theme-section">
      <div class="section-head">
        <h2 class="section-title">분야별 보기</h2>
      </div>

      <div id="themeGrid" class="theme-grid" role="region" aria-label="분야 선택"></div>
    </section>

    <!-- 전체 질의 -->
    <section id="archiveSection" class="archive-section">
      <div class="section-head">
        <h2 class="section-title">전체 질의</h2>
        <div class="archive-meta-bar">
          <span id="resultCount" class="result-count"><strong>51</strong>건</span>
          <button type="button" id="resetFilterBtn" class="btn-reset-filter" style="display: none;">
            필터 해제 ✕
          </button>
        </div>
      </div>

      <!-- 검색창 & 보기 방식 전환 -->
      <div class="archive-toolbar">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="검색어 입력 (예: GTX-B, 춘천, 강촌콘도, 다자녀, LH, 인천공항)"
            aria-label="질의 검색"
          />
          <button type="button" id="searchClear" class="search-clear" title="검색어 지우기">지우기</button>
        </div>

        <div class="view-switch" role="group" aria-label="보기 방식">
          <button type="button" id="viewCardBtn" class="view-btn active">
            카드
          </button>
          <button type="button" id="viewSlideBtn" class="view-btn">
            크게 보기
          </button>
          <button type="button" id="viewListBtn" class="view-btn">
            목록
          </button>
        </div>
      </div>

      <!-- 키워드 태그 -->
      <div class="keyword-bar">
        <span class="keyword-label">키워드</span>
        <div id="quickTags" class="keyword-list"></div>
      </div>

      <!-- 결과 영역 -->
      <div id="resultsContainer"></div>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="container footer-inner-simple">
      <strong class="footer-heading">국회의원 허영 의원실</strong>
      <span class="footer-desc">더불어민주당 (강원 춘천·철원·화천·양구갑) · 국회 국토교통위원회</span>
    </div>
  </footer>

  <!-- 상세 모달 -->
  <div id="detailModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-topbar">
        <div id="modalBadges" class="modal-badges"></div>
        <div class="modal-actions">
          <button type="button" id="modalShareBtn" class="modal-action-btn" title="링크 복사">
            링크 복사
          </button>
          <button type="button" id="modalPrintBtn" class="modal-action-btn" title="인쇄">
            인쇄
          </button>
          <button type="button" id="modalCloseBtn" class="modal-close-btn" title="닫기 (ESC)">
            닫기 ✕
          </button>
        </div>
      </div>

      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-meta-bar">
          <span class="modal-metric-pill" id="modalMetric"></span>
          <span class="modal-target-pill" id="modalTarget"></span>
        </div>
      </div>

      <div id="modalContent" class="modal-body"></div>

      <div class="modal-footer">
        <button type="button" id="modalPrevBtn" class="modal-nav-btn">
          ← 이전
        </button>
        <button type="button" id="modalNextBtn" class="modal-nav-btn">
          다음 →
        </button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div id="toast" class="toast-message" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
